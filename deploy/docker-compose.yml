services:
  web:
    image: nginx:1.28-alpine
    container_name: mini-crm
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.inc:/etc/nginx/security-headers.inc:ro
    networks:
      - proxy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mini-crm.rule=Host(`crm.201.51.8.29.nip.io`)"
      - "traefik.http.routers.mini-crm.entrypoints=websecure"
      - "traefik.http.routers.mini-crm.tls=true"
      - "traefik.http.routers.mini-crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.mini-crm.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: proxy
